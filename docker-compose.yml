version: "3.8"

networks:
  glifos_network:
    driver: bridge

services:
  app:
    build:
      context: app
    ports:
      - "5500"
    networks:
      - glifos_network
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TYPE=${SESSION_TYPE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DB=${MYSQL_DB}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
    env_file:
      - .env
    depends_on:
      - db

  db:
    restart: always
    image: mysql:5.7
    networks:
      - glifos_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    env_file:
      - .env
    ports:
      - "3308:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:rw
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    networks:
      - glifos_network
    expose:
      - 80
    ports:
      - "82:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:latest
    networks:
      - glifos_network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    ports:
      - "81:81"

volumes:
  db_data:
