version: "3.8"

networks:
  glifos_network:
    driver: bridge

services:
  app:
    build:
      context: app
    ports:
      - "5500"
    networks:
      - glifos_network
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TYPE=${SESSION_TYPE}
      # Variables PostgreSQL principales
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      # Alias MYSQL_* mantenidos por compatibilidad con el código heredado
      - MYSQL_USER=${POSTGRES_USER}
      - MYSQL_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_HOST=${POSTGRES_HOST}
      - MYSQL_PORT=${POSTGRES_PORT}
      - MYSQL_DB=${POSTGRES_DB}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: always
    image: postgres:16-alpine
    networks:
      - glifos_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    networks:
      - glifos_network
    expose:
      - 80
    ports:
      - "82:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@glifosmayas.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: nginx:latest
    networks:
      - glifos_network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    ports:
      - "81:81"

volumes:
  pg_data_v2:
